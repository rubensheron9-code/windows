      - name: Admin wallpaper
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $w = 1920; $h = 1080
          $bmp = New-Object System.Drawing.Bitmap $w, $h
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = 'AntiAlias'
          $g.TextRenderingHint = 'AntiAlias'

          # Dark background
          $rect = New-Object System.Drawing.Rectangle 0, 0, $w, $h
          $bg = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect, [System.Drawing.Color]::FromArgb(5,10,25), [System.Drawing.Color]::FromArgb(12,40,70), 45.0)
          $g.FillRectangle($bg, $rect)

          # Grid
          $gridPen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(35,0,200,255)), 1
          for ($x = 0; $x -lt $w; $x += 60) { $g.DrawLine($gridPen, $x, 0, $x, $h) }
          for ($y = 0; $y -lt $h; $y += 60) { $g.DrawLine($gridPen, 0, $y, $w, $y) }

          # Glow rings behind the title
          foreach ($r in 520, 420, 320) {
            $ring = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(40,0,200,255)), 3
            $g.DrawEllipse($ring, ($w/2 - $r), ($h/2 - $r), ($r*2), ($r*2))
          }

          $center = New-Object System.Drawing.StringFormat
          $center.Alignment = 'Center'
          $center.LineAlignment = 'Center'

          # Big ADMIN title (glow layer, then solid)
          $big = New-Object System.Drawing.Font("Consolas", 190, [System.Drawing.FontStyle]::Bold)
          $glow = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(60,0,220,255))
          foreach ($d in -6, -3, 3, 6) {
            $g.DrawString("ADMIN", $big, $glow, ($w/2 + $d), ($h/2 - 60 + $d), $center)
          }
          $cyan = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(0,225,255))
          $g.DrawString("ADMIN", $big, $cyan, ($w/2), ($h/2 - 60), $center)

          # Subtitle
          $sub = New-Object System.Drawing.Font("Consolas", 34, [System.Drawing.FontStyle]::Bold)
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(230,240,255))
          $g.DrawString("A D M I N I S T R A T O R   A C C E S S", $sub, $white, ($w/2), ($h/2 + 120), $center)

          # Status text, bottom left
          $small = New-Object System.Drawing.Font("Consolas", 20)
          $green = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(70,255,120))
          $lines = @(
            "> SYSTEM ONLINE",
            "> PRIVILEGE LEVEL: ADMINISTRATOR",
            "> HOST: $env:COMPUTERNAME",
            "> STATUS: ALL SERVICES RUNNING"
          )
          $y = $h - 200
          foreach ($l in $lines) { $g.DrawString($l, $small, $green, 60, $y); $y += 36 }

          # Corner brackets
          $br = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(0,225,255)), 4
          $g.DrawLines($br, @((New-Object System.Drawing.Point(40,120)), (New-Object System.Drawing.Point(40,40)), (New-Object System.Drawing.Point(120,40))))
          $g.DrawLines($br, @((New-Object System.Drawing.Point(($w-40),120)), (New-Object System.Drawing.Point(($w-40),40)), (New-Object System.Drawing.Point(($w-120),40))))
          $g.DrawLines($br, @((New-Object System.Drawing.Point(40,($h-120))), (New-Object System.Drawing.Point(40,($h-40))), (New-Object System.Drawing.Point(120,($h-40)))))
          $g.DrawLines($br, @((New-Object System.Drawing.Point(($w-40),($h-120))), (New-Object System.Drawing.Point(($w-40),($h-40))), (New-Object System.Drawing.Point(($w-120),($h-40)))))
          $g.Dispose()

          $file = "C:\Users\Public\Pictures\admin-wallpaper.png"
          New-Item -ItemType Directory -Path (Split-Path $file) -Force | Out-Null
          $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          # runneradmin (current user)
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value $file
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value '10'
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name TileWallpaper -Value '0'

          # New accounts such as RDP get it from the default profile
          try {
            reg load HKU\DefUser C:\Users\Default\NTUSER.DAT | Out-Null
            reg add "HKU\DefUser\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d $file /f | Out-Null
            reg add "HKU\DefUser\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d 10 /f | Out-Null
            reg add "HKU\DefUser\Control Panel\Desktop" /v TileWallpaper /t REG_SZ /d 0 /f | Out-Null
            [gc]::Collect()
            Start-Sleep -Seconds 2
            reg unload HKU\DefUser | Out-Null
          } catch { Write-Warning "Default profile wallpaper failed: $_" }

          Write-Host "Wallpaper saved to $file"
